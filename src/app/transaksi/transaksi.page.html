<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Riwayat Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="transactions.length === 0" class="ion-padding ion-text-center">
    <p>Belum ada transaksi.</p>
  </div>

  <ion-list>
    <ion-accordion-group>
      <ion-accordion *ngFor="let tx of transactions" [value]="tx.id">
        <ion-item slot="header" color="light">
          <ion-label>
            <h2>Trans ID: {{ tx.id }}</h2>
            <p>{{ tx.date | date:'short' }}</p>
          </ion-label>
          <ion-note slot="end" color="success">Rp{{ tx.total }}</ion-note>
        </ion-item>
        <div class="ion-padding" slot="content">
          <ion-list>
            <ion-item *ngFor="let item of tx.items" lines="none">
              <ion-label>
                {{ item.product.name }}
              </ion-label>
              <ion-note slot="end">{{ item.quantity }} x Rp{{ item.product.sellPrice }}</ion-note>
            </ion-item>
          </ion-list>
        </div>
      </ion-accordion>
    </ion-accordion-group>
  </ion-list>
</ion-content>
